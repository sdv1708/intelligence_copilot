[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that load the real embedding model or hit the network",
]
filterwarnings = [
    "error::DeprecationWarning:core.*",
    "error::DeprecationWarning:agents.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function call in default arg: pydantic Field() is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# The TYPE_CHECKING block there declares the names re-exported lazily by
# `__getattr__`; they are unused at runtime by construction.
"agents/__init__.py" = ["F401"]
